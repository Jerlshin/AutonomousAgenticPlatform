# Stages 4–5 of the pipeline in docs/ARCHITECTURE.md §19: image builds and a compose smoke
# test. This file was a zero-byte stub — a workflow that silently did nothing, which is
# worse than no workflow at all because the Actions tab showed it as present (defect D-019).
#
# There is no deployment step and there will not be one. This is a locally hosted platform,
# so the pipeline's job is to prove the images build and the stack comes up healthy, not to
# ship anything anywhere.

name: Docker Build & Compose Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  Stage 4 · Build images
  # ---------------------------------------------------------------------------
  build:
    name: 4 · Build images
    runs-on: ubuntu-latest
    strategy:
      # One broken Dockerfile should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: mlflow
            context: infrastructure/docker/mlflow
            dockerfile: infrastructure/docker/mlflow/Dockerfile
          - name: sandbox-exec
            context: infrastructure/docker/sandbox
            dockerfile: infrastructure/docker/sandbox/Dockerfile.exec
          - name: sandbox-train
            context: infrastructure/docker/sandbox
            dockerfile: infrastructure/docker/sandbox/Dockerfile.train
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Does this image have a Dockerfile yet?
        id: probe
        # Several of these are specified but empty (§10.10, §21). A zero-byte Dockerfile
        # is what made the old version of this workflow a no-op, so it is checked for
        # explicitly and announced rather than silently skipped.
        run: |
          if [ -s "${{ matrix.dockerfile }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.name }} image skipped::${{ matrix.dockerfile }} is missing or empty — see ARCHITECTURE.md §21"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.probe.outputs.ready == 'true'

      - name: Build
        if: steps.probe.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: pluton-${{ matrix.name }}:ci
          # §19.3: Buildx layer cache, which is what keeps a rebuild of the ~1.4 GiB train
          # image from costing the whole job's runtime on every push.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ---------------------------------------------------------------------------
  #  Stage 5 · Compose smoke
  # ---------------------------------------------------------------------------
  compose-smoke:
    name: 5 · Compose smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Generate a .env
        # The compose file interpolates from the repository-root .env, which is git-ignored
        # by design (§13.3). Generating one gives the run real secrets that exist only for
        # the life of the job.
        run: |
          pip install "pydantic-settings>=2.3"
          python scripts/gen_env_example.py
          cp .env.example .env
          python scripts/gen_secrets.py .env

      - name: Validate the compose file
        # Catches an interpolation or schema error in seconds, before spending minutes
        # pulling images to discover it.
        run: |
          docker compose --env-file .env -f infrastructure/docker-compose.yml config --quiet
          docker compose --env-file .env -f infrastructure/docker-compose.yml --profile observability config --quiet

      - name: Start the data services
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml up -d postgres redis qdrant mlflow

      - name: Wait for every service to report healthy
        # §19.1's gate: healthy within 120 s or the job fails. Polls the health status
        # compose itself computes, rather than re-implementing four different probes.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          services="autonomous_postgres autonomous_redis autonomous_qdrant autonomous_mlflow"
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            unhealthy=""
            for service in $services; do
              status=$(docker inspect -f '{{ .State.Health.Status }}' "$service" 2>/dev/null || echo missing)
              [ "$status" = "healthy" ] || unhealthy="$unhealthy $service($status)"
            done
            if [ -z "$unhealthy" ]; then
              echo "all services healthy"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Compose smoke failed::still unhealthy after 120s:$unhealthy"
              exit 1
            fi
            sleep 5
          done

      - name: Apply migrations against the live database
        # The strongest signal this stage can produce: the schema the repository describes
        # applies cleanly to the server the compose file starts.
        run: |
          pip install -e ".[dev]"
          cd backend && alembic upgrade head

      - name: Probe the deep health endpoint
        # Runs the API against the compose stack the way `make dev` does, then asserts on
        # the same §8 contract a monitor would: 200 and a non-unhealthy status.
        run: |
          set -euo pipefail
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/deep | tee /tmp/deep.json
          python - <<'PY'
          import json, sys
          body = json.load(open("/tmp/deep.json"))
          print("status:", body.get("status"))
          # `degraded` is a pass: MLflow and Ollama are soft dependencies (§8, defect D-013)
          # and Ollama is deliberately absent from the runner.
          sys.exit(0 if body.get("status") in {"ok", "healthy", "degraded"} else 1)
          PY

      - name: The API exposes Prometheus metrics
        # §12.1's exposition endpoint, checked end to end rather than only in unit tests:
        # a scrape target that 500s is invisible until a dashboard is empty.
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^pluton_http_requests_total'
          echo "metrics endpoint OK"

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml down -v
