# GitHub Actions workflow configuration. It automates CI
name: CI Pipeline

# automatically fires this workflow every time code is pushed or pulled
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # checks out the repo source code into runner VM so the workflow can access it
      
      - name: Set up Python
        uses: actions/setup-python@v5 # installs and configures python 3.11
        with:
          python-version: '3.11'
          
      - name: Install Ruff # setup ruff
        run: pip install ruff
        
      - name: Run Ruff Lint & Format Checks # runs the commands
        run: |
          cd backend
          ruff check .
          ruff format --check .

  config-contract:
    # `.env.example` is generated from Settings; this fails the build if the checked-in
    # copy has drifted from the fields the application actually reads (defect D-012).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install settings dependencies
        run: pip install "pydantic-settings>=2.3" pytest

      - name: Check .env.example is in sync with Settings
        run: python scripts/gen_env_example.py --check

      - name: Run configuration regression tests
        run: |
          cd backend
          python -m pytest tests/test_config.py tests/test_alembic_env.py -q

      - name: Check documentation links
        run: python scripts/check_docs_links.py
