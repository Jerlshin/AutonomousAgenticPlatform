# Infrastructure stack for local development (ARCHITECTURE.md §15).
#
# Every service declares a health check, and anything with a real dependency waits on
# `condition: service_healthy` rather than racing it (defect D-008). The api, worker and
# frontend services are not here yet — Phase 0 runs the API on the host with `make dev`,
# which is also why the backend's defaults are the localhost forms. Services that do run
# in this network receive the in-network address as an explicit environment override.
#
# Values interpolate from the repository-root .env (the Makefile passes --env-file), with
# the compose defaults below matching backend/app/core/config.py.

name: pluton

services:
  postgres:
    image: postgres:16-alpine # the official postgres image built on alpine linux
    container_name: autonomous_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_dev}
    ports:
      - "5432:5432" # maps the container port to a port on the host
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistent storage for the cluster
    networks:
      - platform_net
    healthcheck:
      # $$ escapes compose interpolation so the container's shell expands these.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: autonomous_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - platform_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: autonomous_qdrant
    restart: always
    ports:
      - "6333:6333" # REST API and web dashboard
      - "6334:6334" # gRPC API — binary, used for bulk ingestion
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - platform_net
    healthcheck:
      # The image ships neither curl nor wget, so the probe speaks HTTP over bash's
      # /dev/tcp. ARCHITECTURE.md §15.2 documents the intent: GET /readyz must return 200.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mlflow:
    # Built locally: the upstream image has no PostgreSQL driver (ADR-013).
    build:
      context: ./docker/mlflow
    image: pluton-mlflow:2.12.1
    container_name: autonomous_mlflow
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_dev}
      MLFLOW_POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
      MLFLOW_WORKERS: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "120"
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
    ports:
      - "5001:5000" # host 5001 — macOS AirPlay Receiver claims 5000 (ADR-015)
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - platform_net
    depends_on:
      postgres:
        # Without this the server raced Postgres and crash-looped on first boot.
        condition: service_healthy
    healthcheck:
      # No curl in the image either; python is guaranteed to be there.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:5000/health", timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  #  Observability  (ARCHITECTURE.md §12) — `make up PROFILE=observability`
  # ============================================================================
  #
  # Off by default. On a 16 GB laptop the six containers below cost roughly 600 MB and
  # some steady CPU, which is a real fraction of what is left after Postgres, Qdrant and
  # a 7B model — so this is opt-in rather than something every `make up` pays for.

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: autonomous_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to compare this week's benchmark run against last week's, short
      # enough that the TSDB stays a few hundred megabytes on a laptop.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # The API, the worker and Ollama all run natively on the host (ADR-012), so two of
      # the scrape jobs target `host.docker.internal`. Docker Desktop provides that name;
      # on Linux this line is what makes it resolve.
      - "host.docker.internal:host-gateway"
    networks:
      - platform_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.1.0
    container_name: autonomous_grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Generated by `make init-secrets` alongside the API token and the Postgres
      # password (§13.3). The fallback exists so the profile starts on a clean clone.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # This platform binds to loopback and has one user. Anonymous *viewing* saves a
      # login on every dashboard; the admin password still guards every write.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/run-pipeline.json
    ports:
      - "3001:3000" # 3000 belongs to the Next.js frontend
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - platform_net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: autonomous_node_exporter
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - platform_net

  cadvisor:
    # v0.49.1 is the last tag published for linux/arm64, which the primary development
    # target needs. Newer amd64-only tags silently fail to start on Apple silicon.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: autonomous_cadvisor
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - platform_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: autonomous_postgres_exporter
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_dev}@postgres:5432/${POSTGRES_DB:-agent_platform}?sslmode=disable"
    networks:
      - platform_net
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: autonomous_redis_exporter
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # Publishes `redis_stream_length` per run stream, which is what the System board's
      # stream-length panel reads. Without it the exporter reports totals only and
      # "which run is filling Redis" has no answer.
      REDIS_EXPORTER_CHECK_STREAMS: "run:*:events"
    networks:
      - platform_net
    depends_on:
      redis:
        condition: service_healthy

  dcgm-exporter:
    # NVIDIA only, and Linux only. macOS has no Prometheus-compatible GPU counters at all
    # (§12.1), which is why this is a separate profile rather than part of observability:
    # starting it on the primary development target would fail on every `make up`.
    image: nvidia/dcgm-exporter:3.3.6-3.4.2-ubuntu22.04
    container_name: autonomous_dcgm_exporter
    profiles: ["linux-gpu"]
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
