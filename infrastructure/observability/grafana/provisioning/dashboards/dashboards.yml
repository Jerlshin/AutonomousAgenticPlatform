# Dashboard provisioning (ARCHITECTURE.md §12.2).
#
# `allowUiUpdates: false` and `disableDeletion: true` together make the JSON files the
# source of truth: a panel edited in the browser is reverted on the next reload. That is
# deliberate — a dashboard that only exists in a Grafana volume is lost the first time
# somebody runs `make nuke`.

apiVersion: 1

providers:
  - name: pluton
    orgId: 1
    folder: Pluton
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
